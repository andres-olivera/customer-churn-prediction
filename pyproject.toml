[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "Reproducible telecom churn prediction portfolio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.7,<4",
  "joblib>=1.3,<2"
]

[project.optional-dependencies]
app = ["streamlit>=1.35,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
