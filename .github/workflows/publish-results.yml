name: Verified real-data experiment

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/publish-results.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-experiment-main
  cancel-in-progress: false

jobs:
  train-evaluate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit and integration tests
        run: pytest -q
      - name: Fetch official dataset from UCI and validate
        run: python scripts/download_data.py
      - name: Train and evaluate on original data (full 5-fold CV)
        run: python scripts/train.py
      - name: Generate visual diagnostics
        run: python scripts/figures.py
      - name: Summarize measurements
        run: python scripts/summarize_results.py
      - name: Re-evaluate with exact-profile-grouped train CV and holdout
        run: python scripts/audit_robustness.py
      - name: Summarize robust validation measurements
        run: python scripts/summarize_robustness.py
      - name: Publish only real metrics and graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/metrics.json reports/EXPERIMENT.md reports/figures/ reports/grouped_holdout.json reports/GROUPED_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "reports: publish reproducible real-data evaluation"
            git push origin HEAD:main
          else
            echo "No report changes."
          fi
